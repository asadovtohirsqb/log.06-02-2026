databaseChangeLog:
  - changeSet:
      id: 202602061714_create_order_param_audit
      author: t.asadov
      changes:
        - createTable:
            tableName: order_param_audit
            remarks: "OrderParam o'zgarishlari uchun audit jadvallari (status va boshqa muhim field'lar)"
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  remarks: "Avtomatik generatsiya qilinadigan primary key"
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_param_id
                  type: bigint
                  remarks: "Qaysi buyurtma o'zgargan (order_params.id)"
                  constraints:
                    nullable: false

              - column:
                  name: old_data
                  type: jsonb
                  remarks: "O'zgartirishdan oldingi holat (butun entity JSON)"

              - column:
                  name: new_data
                  type: jsonb
                  remarks: "O'zgartirishdan keyingi holat (butun entity JSON)"

              - column:
                  name: changed_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: "O'zgartirish vaqti"
                  constraints:
                    nullable: false

              - column:
                  name: changed_by
                  type: varchar(100)
                  remarks: "Kim o'zgartirgan (masalan PNFL yoki user ID)"

        # Indekslar (query tezligi uchun juda muhim)
        - createIndex:
            tableName: order_param_audit
            indexName: idx_order_param_audit_order_param_id
            columns:
              - column:
                  name: order_param_id

        - createIndex:
            tableName: order_param_audit
            indexName: idx_order_param_audit_changed_at
            columns:
              - column:
                  name: changed_at

        # Qo'shimcha indeks (masalan, vaqt oralig'ida qidirish uchun)
        - createIndex:
            tableName: order_param_audit
            indexName: idx_order_param_audit_changed_by
            columns:
              - column:
                  name: changed_by